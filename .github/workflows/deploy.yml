---
name: Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes and restart Docker Compose
        run: |
          cd ~/ansible-test
          git pull origin main
          docker compose up -d --build --force-recreate
