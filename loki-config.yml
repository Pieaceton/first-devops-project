auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  ring:
    replication_factor: 1
    kv_store:
      type: inmemory

schema_configs:
  - configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          period: 24h
          prefix: loki_index_

querier:
  max_cache_freshness: 24h

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /tmp/loki
  compaction_ring:
    kv_store:
      type: inmemory

ruler_storage:
  type: filesystem
  filesystem:
    rules_directory: /tmp/loki/rules

analytics:
  reporting_enabled: false
