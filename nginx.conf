events {}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        # Nginx слушает порт 80 внутри контейнера
        listen 80;

        # Health check приложения: JSON {"status": "ok"}
        location /health {
            proxy_pass http://python-app:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Метрики приложения в формате Prometheus text exposition
        location /metrics {
            proxy_pass http://python-app:8000/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            # Пересылаем весь входящий трафик на контейнер python-app на порт 8000
            proxy_pass http://python-app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
