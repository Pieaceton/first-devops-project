events {}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    limit_req_zone  zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        return 301 https://System.Management.Automation.Internal.Host.InternalHost;
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        add_header X-Frame-Options  SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        location /health {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://python-app:8000/health;
            proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
        }

        location /metrics {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://python-app:8000/metrics;
            proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://python-app:8000;
            proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
        }
    }
}
