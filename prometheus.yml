---
global:
  scrape_interval: 5s

rule_files: ["alert_rules.yml"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "python-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["python-app:8000"]
