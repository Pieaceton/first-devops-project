---
- name: Configure and deploy infrastructure on local VM
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    project_dir: /home/user/ansible-test
    config_files:
      - "{{ project_dir }}/docker-compose.yml"
      - "{{ project_dir }}/prometheus.yml"
      - "{{ project_dir }}/loki-config.yml"
      - "{{ project_dir }}/promtail-config.yml"

  tasks:
    - name: Fix any pending dpkg issues
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 300

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install Docker Python SDK
      ansible.builtin.pip:
        name: docker
        state: present
        extra_args: "--break-system-packages"

    - name: Ensure Docker service is enabled and started
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker daemon to be ready
      ansible.builtin.command: docker info
      register: docker_info
      until: docker_info.rc == 0
      retries: 15
      delay: 5

    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Check that configuration files are present
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_stats
      loop: "{{ config_files }}"

    - name: Verify configuration files are present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Отсутствует конфигурационный файл: {{ item.item }}"
      loop: "{{ config_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Deploy or restart the Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        recreate: always
        build: always

    - name: Wait for the application to become available through Nginx
      ansible.builtin.uri:
        url: http://localhost:8080/health
        method: GET
        status_code: 200
        return_content: true
      register: app_health
      until: app_health.status == 200
      retries: 10
      delay: 5

    - name: Verify the application metrics endpoint
      ansible.builtin.uri:
        url: http://localhost:8080/metrics
        method: GET
        status_code: 200
        return_content: true
      register: app_metrics
      until: app_metrics.status == 200
      retries: 10
      delay: 5

    - name: Check that k3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Verify k3s is installed
      ansible.builtin.assert:
        that:
          - k3s_binary.stat.exists
        fail_msg: "k3s is not installed; install it with the official get.k3s.io script"

    - name: Ensure k3s service is enabled and started
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for the k3s node to become Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=180s
      changed_when: false

    - name: Apply Kubernetes application manifests
      ansible.builtin.command: kubectl apply -f k8s/
      args:
        chdir: "{{ project_dir }}"
      register: k8s_apply
      changed_when: >-
        'created' in k8s_apply.stdout or
        'configured' in k8s_apply.stdout

    - name: Display deployed containers
      ansible.builtin.debug:
        msg: "Infrastructure stack deployed successfully"

    - name: Display Kubernetes deployment result
      ansible.builtin.debug:
        var: k8s_apply.stdout_lines

    - name: Display application health check result
      ansible.builtin.debug:
        var: app_health.json
