---
- name: Configure and deploy infrastructure on local VM
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    project_dir: /home/user/ansible-test
    config_files:
      - "{{ project_dir }}/docker-compose.yml"
      - "{{ project_dir }}/prometheus.yml"
      - "{{ project_dir }}/loki-config.yml"
      - "{{ project_dir }}/promtail-config.yml"

  tasks:
    - name: Fix any pending dpkg issues
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 300

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install Docker Python SDK
      ansible.builtin.pip:
        name: docker
        state: present
        extra_args: "--break-system-packages"

    - name: Ensure Docker service is enabled and started
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker daemon to be ready
      ansible.builtin.command: docker info
      register: docker_info
      until: docker_info.rc == 0
      retries: 15
      delay: 5

    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy or restart the Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        recreate: always

    - name: Wait for the application to become available through Nginx
      ansible.builtin.uri:
        url: http://localhost:8080/health
        method: GET
        status_code: 200
        return_content: true
      register: app_health
      until: app_health.status == 200
      retries: 10
      delay: 5

    - name: Verify the application metrics endpoint
      ansible.builtin.uri:
        url: http://localhost:8080/metrics
        method: GET
        status_code: 200
        return_content: true
      register: app_metrics
      until: app_metrics.status == 200
      retries: 10
      delay: 5

    - name: Display deployed containers
      ansible.builtin.debug:
        msg: "Infrastructure stack deployed successfully"

    - name: Display application health check result
      ansible.builtin.debug:
        var: app_health.json
