---
- name: Configure and deploy infrastructure on local VM
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    project_dir: /home/user/ansible-test

  tasks:
    - name: Fix any pending dpkg issues
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 300

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install Docker Python SDK
      ansible.builtin.pip:
        name: docker
        state: present
        extra_args: "--break-system-packages"

    - name: Ensure Docker service is enabled and started
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker daemon to be ready
      ansible.builtin.command: docker info
      register: docker_info
      until: docker_info.rc == 0
      retries: 15
      delay: 5

    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy or restart the Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        recreate: always

    - name: Display deployed containers
      ansible.builtin.debug:
        msg: "Infrastructure stack deployed successfully"
